spring.application.name=ecommerce

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.uploads.directory=${UPLOADS_DIRECTORY:uploads/products}
# Image storage: "local" (default, files on disk) or "cloudinary" (survives restarts on hosts with temporary disks).
app.image-storage=${IMAGE_STORAGE:local}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:ecommerce/products}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
app.rate-limit.login-attempts=${AUTH_LOGIN_ATTEMPTS:20}
app.rate-limit.registration-attempts=${AUTH_REGISTRATION_ATTEMPTS:10}
app.rate-limit.account-failures=${AUTH_ACCOUNT_FAILURES:10}
app.rate-limit.window-minutes=${AUTH_RATE_LIMIT_WINDOW_MINUTES:15}
app.rate-limit.maximum-entries=${AUTH_RATE_LIMIT_MAXIMUM_ENTRIES:100000}
app.admin.email=${ADMIN_EMAIL:admin@ecommerce.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123456}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:86400000}
